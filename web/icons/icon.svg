<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing background orb -->
  <circle cx="256" cy="240" r="130" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>

  <!-- Dual Brain / Sparkle Emblem -->
  <!-- Outer Neural Ring -->
  <circle cx="256" cy="240" r="115" fill="none" stroke="url(#shield)" stroke-width="4" stroke-dasharray="14 8" opacity="0.6"/>

  <!-- Core Diamond Sparkle (Hope Beacon) -->
  <path d="M 256 120 C 256 195 210 240 135 240 C 210 240 256 285 256 360 C 256 285 302 240 377 240 C 302 240 256 195 256 120 Z" fill="url(#sparkle)" filter="url(#glow)"/>

  <!-- Center Core Orb -->
  <circle cx="256" cy="240" r="24" fill="#ffffff" filter="url(#glow)"/>

  <!-- Secondary Satellite Nodes (Ollama / MCP Tools) -->
  <circle cx="160" cy="180" r="10" fill="#38bdf8"/>
  <circle cx="352" cy="180" r="10" fill="#c084fc"/>
  <circle cx="170" cy="310" r="10" fill="#818cf8"/>
  <circle cx="342" cy="310" r="10" fill="#ec4899"/>

  <!-- Label 'HOPE' -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="8">HOPE</text>
</svg>

